plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.assistant'
        minSdk 29
        targetSdk 33
        versionCode 2
        versionName '2.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    androidResources {
        noCompress += 'gguf'
    }
}

def offlineModel = file('src/main/assets/jarvis-offline-model.gguf')
def offlineModelUrl = 'https://huggingface.co/second-state/gemma-3-270m-it-GGUF/resolve/main/gemma-3-270m-it-Q4_K_M.gguf'
def offlineModelSha256 = '57bbce8f2095939bde118bafbb65279c6e36ee8bcb09ee258f7f5d6a7b8e7f39'

tasks.register('downloadJarvisOfflineModel') {
    outputs.file(offlineModel)
    doLast {
        if (offlineModel.exists() && offlineModel.length() > 250_000_000L) {
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            offlineModel.withInputStream { stream ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
            }
            def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            if (actual == offlineModelSha256) return
            offlineModel.delete()
        }
        offlineModel.parentFile.mkdirs()
        def temporary = new File(offlineModel.parentFile, offlineModel.name + '.part')
        temporary.delete()
        new URL(offlineModelUrl).openConnection().with { connection ->
            connectTimeout = 30000
            readTimeout = 120000
            inputStream.withCloseable { input ->
                temporary.withOutputStream { output ->
                    byte[] buffer = new byte[1024 * 1024]
                    int count
                    while ((count = input.read(buffer)) > 0) output.write(buffer, 0, count)
                }
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        temporary.withInputStream { stream ->
            byte[] buffer = new byte[1024 * 1024]
            int count
            while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (temporary.length() < 250_000_000L || actual != offlineModelSha256) {
            temporary.delete()
            throw new GradleException("JARVIS offline model failed size/SHA-256 verification: ${actual}")
        }
        if (offlineModel.exists()) offlineModel.delete()
        if (!temporary.renameTo(offlineModel)) throw new GradleException('Could not finalize JARVIS offline model asset')
    }
}

tasks.matching { it.name == 'mergeDebugAssets' || it.name == 'mergeReleaseAssets' }.configureEach {
    dependsOn tasks.named('downloadJarvisOfflineModel')
}

dependencies {
    implementation project(':llama-kt')
    testImplementation 'junit:junit:4.13.2'
}
