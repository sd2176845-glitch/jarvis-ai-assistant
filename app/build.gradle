plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.assistant'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
