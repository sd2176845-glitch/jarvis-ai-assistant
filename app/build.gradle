plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.assistant'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'JARVIS_API_BASE_URL', '"https://YOUR_SERVER_DOMAIN/api/jarvis/chat"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }
}

dependencies {
    // AndroidX compatibility helpers (ActivityCompat and NotificationCompat).
    implementation "androidx.core:core-ktx:1.15.0"

    // Kotlin Standard & Coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Android Lifecycle & ViewModel
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

    // Networking for Gemini AI Engine
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // JSON Parsing
    implementation "org.json:json:20240303"
}
