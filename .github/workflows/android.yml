name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and native inference submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4

      - name: Install pinned Android native toolchain
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Bootstrap pinned llama.cpp Android sources
        run: |
          git submodule update --init --recursive
          bash libs/llama.kt/scripts/bootstrap.sh

      - name: Configure native inference for Android without OpenCL SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("libs/llama.kt/llama-kt/src/main/cpp/CMakeLists.txt")
          s = p.read_text()
          replacements = [
              ("    ${SRC_DIR}/ggml-opencl/ggml-opencl.cpp\\n", ""),
              ("    ${SRC_DIR}/ggml-opencl/cl-program-cache.cpp\\n", ""),
              ("    ${GGML_OPENCL_KERNEL_HEADERS}\\n", ""),
              ("    -DLM_GGML_USE_OPENCL\\n", ""),
              ("    -DLM_GGML_OPENCL_USE_ADRENO_KERNELS\\n", ""),
              ("    -DLM_GGML_OPENCL_EMBED_KERNELS\\n", ""),
              ("    -DLM_GGML_OPENCL_SOA_Q\\n", ""),
              ("    ${CMAKE_CURRENT_SOURCE_DIR}/../jniLibs/${ANDROID_ABI}\\n", ""),
              ("    OpenCL\\n", ""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit("Expected OpenCL CMake entry missing; refusing unsafe patch: " + repr(old))
              s = s.replace(old, new, 1)
          p.write_text(s)
          print("OpenCL backend disabled for this Android build; CPU + Vulkan backends retained.")
          PY

      - name: Validate backend JavaScript syntax
        run: node --check server.js

      - name: Run Android unit tests
        run: gradle testDebugUnitTest

      - name: Upload Android unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Run Android lint
        run: gradle lintDebug

      - name: Build debug APK with bundled offline model
        run: gradle assembleDebug

      - name: Verify APK contains the bundled offline model
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/jarvis-offline-model\.gguf'
          SIZE=$(stat -c%s "$APK")
          echo "JARVIS debug APK bytes: $SIZE"
          test "$SIZE" -gt 200000000
          test "$SIZE" -lt 300000000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
