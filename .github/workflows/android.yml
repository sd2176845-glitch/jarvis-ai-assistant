name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate backend JavaScript syntax
        run: node --check server.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-signing-key-v1

      - name: Run Android unit tests
        run: gradle testDebugUnitTest

      - name: Upload Android unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle lintDebug
          LINT_EXIT=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== FULL ANDROID LINT REPORT ====="
            cat "$REPORT"
          else
            echo "Lint text report was not generated at $REPORT"
          fi
          exit "$LINT_EXIT"

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
